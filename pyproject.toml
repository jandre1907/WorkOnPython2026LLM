[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A pedagogical project to build a Large Language Model from scratch using Python."
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.64.0",
    "jupyter>=1.0.0",
]
requires-python = ">=3.8"
readme = "README.md"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "src"